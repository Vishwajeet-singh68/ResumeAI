name: ResumeAI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: 17
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-test-docker:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - SERVICE-REGISTRY
          - RESUMEAI-GATEWAY

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Give Execute Permission to Maven Wrapper
        working-directory: ./${{ matrix.service }}
        run: chmod +x mvnw

      - name: Build Spring Boot Application
        working-directory: ./${{ matrix.service }}
        run: ./mvnw clean install -DskipTests

      - name: Run Unit Tests
        working-directory: ./${{ matrix.service }}
        run: ./mvnw test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Convert Service Name to Lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker Image
        working-directory: ./${{ matrix.service }}
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest
